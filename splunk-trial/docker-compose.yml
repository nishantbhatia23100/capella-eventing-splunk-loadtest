# Fresh, isolated Splunk Enterprise for the Eventing load tests (own volumes; does not touch splunk-demo).
# Credentials come from ~/.eventing-test-env (written by ../setup_credentials.sh).
# Starting it accepts Splunk's license terms (same as the earlier demo) and begins a new 60-day Enterprise trial.
name: splunk-trial
services:
  splunk:
    image: splunk/splunk:latest
    platform: linux/amd64
    container_name: splunk-trial
    environment:
      SPLUNK_START_ARGS: "--accept-license"
      SPLUNK_GENERAL_TERMS: "--accept-sgt-current-at-splunk-com"
      SPLUNK_PASSWORD: "${SPLUNK_PASSWORD:?run ../setup_credentials.sh first}"
      SPLUNK_HEC_TOKEN: "${HEC_TOKEN:?run ../setup_credentials.sh first}"
    ports:
      - "${SPLUNK_WEB_PORT:-8000}:8000"
      - "${SPLUNK_HEC_PORT:-8088}:8088"
      - "${SPLUNK_MGMT_PORT:-8089}:8089"
    volumes:
      - splunk-trial-etc:/opt/splunk/etc
      - splunk-trial-var:/opt/splunk/var
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:8089/services/server/info -o /dev/null -w '%{http_code}' | grep -q 401"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s
volumes:
  splunk-trial-etc:
  splunk-trial-var:
