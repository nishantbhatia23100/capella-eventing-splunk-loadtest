# HEC relay: accepts Splunk-HEC-format posts from Eventing, batches them, and forwards to Splunk HEC.
# Eventing's shipper keeps posting HEC events; only its URL changes (to this relay).
#
# Env: SPLUNK_HEC_ENDPOINT (e.g. https://splunk.example.com:8088/services/collector)
#      SPLUNK_HEC_TOKEN    (the token Splunk issued)
#      RELAY_TOKEN         (optional: shared secret Eventing must present; see README)
# Option names follow opentelemetry-collector-contrib ~0.116; validate with
#   otelcol-contrib validate --config=otel-collector-config.yaml   if you change the version.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage:                       # persistent queue: survives relay restarts / Splunk outages
    directory: /var/lib/otelcol/queue
    create_directory: true
    timeout: 5s

receivers:
  splunk_hec:
    endpoint: 0.0.0.0:8088            # same port/path shape as Splunk HEC
    # TLS: terminate at the load balancer, or set tls.cert_file / tls.key_file here.

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20
  batch:
    send_batch_size: 1000             # events per request to Splunk
    send_batch_max_size: 2000
    timeout: 1s                       # never hold events longer than this

exporters:
  splunk_hec:
    endpoint: ${env:SPLUNK_HEC_ENDPOINT}
    token: ${env:SPLUNK_HEC_TOKEN}
    # source/sourcetype/index come from the incoming HEC envelope when present.
    max_content_length_logs: 2097152  # keep requests under Splunk's max_content_length
    timeout: 15s
    max_idle_conns: 20
    max_idle_conns_per_host: 20
    idle_conn_timeout: 30s
    disable_compression: false        # gzip to Splunk
    tls:
      insecure_skip_verify: true      # DEMO ONLY: the local Splunk uses a self-signed certificate
    sending_queue:
      enabled: true
      num_consumers: 4                # parallel requests to Splunk (tune to its connection limit)
      queue_size: 10000
      storage: file_storage
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 600s

service:
  extensions: [health_check, file_storage]
  telemetry:
    metrics:
      address: 0.0.0.0:8888           # otelcol_receiver_accepted_log_records, otelcol_exporter_sent_log_records, queue size
  pipelines:
    logs:
      receivers: [splunk_hec]
      processors: [memory_limiter, batch]
      exporters: [splunk_hec]
